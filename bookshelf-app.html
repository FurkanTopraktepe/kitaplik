    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }

    #quote-card-preview {
      box-shadow: 0 10px 50px -5px rgba(0, 0, 0, 0.3);
    }

    .book-scene {
      perspective: 1200px;
      width: 60px;
      min-width: 60px;
      height: 280px;
      margin-right: 6px;
      margin-bottom: 24px;
      z-index: 10;
      position: relative;
      cursor: pointer;
    }

    .book-scene:hover {
      z-index: 50;
      /* Bring to front on hover */
    }

    .book-object {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: center center -30px;
      /* Adjust pivot */
    }

    .book-scene:hover .book-object {
      transform: rotateY(-70deg) translateX(-20px) translateZ(20px);
    }

    /* The Spine (Front Face) */
    .book-face-spine {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      backface-visibility: visible;
      /* transform: translateZ(0px); */
      border-radius: 4px;
      z-index: 2;
    }

    /* The Cover (Right Face) */
    .book-face-cover {
      position: absolute;
      top: 0;
      left: 60px;
      /* Starts exactly after the spine */
      width: 190px;
      height: 100%;
      transform-origin: left;
      transform: rotateY(90deg);
      backface-visibility: visible;
      border-radius: 0 6px 6px 0;
      background-size: cover;
      background-position: center;
    }
  </style>

    // IndexedDB Helper for storing E-Book files
    const dbName = "bookshelf_ebooks_db";
    const storeName = "files";

    const openDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    };

    const handleImageUpload = (e, targetStateSetter, setCurrentState) => {
      const file = e.target.files[0];
      if (!file) return;

      // Limit file size (e.g., 5MB check before processing, though we compress anyway)
      if (file.size > 5 * 1024 * 1024) {
        alert("Dosya boyutu çok büyük! Lütfen 5MB'dan küçük bir resim seçin. Otomatik olarak küçültülecektir.");
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxSize = 400;

          // Resize logic
          if (width > height) {
            if (width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Compress to JPEG with 0.7 quality
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          if (setCurrentState) {
            targetStateSetter({ ...setCurrentState, coverImage: dataUrl });
          } else {
            targetStateSetter(prev => ({ ...prev, coverImage: dataUrl }));
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    const EBookReader = ({
      book,
      file,
      fileType,
      onClose,
      onUpdateProgress,
      onAddHighlight,
      isDark,
      themeColors,
      rtcStatus,
      rtcChannel,
      rtcChatHistory,
      rtcName,
      onSendRtcMessage
    }) => {
      const [pageNum, setPageNum] = useState(book.currentPage || 1);
      const [numPages, setNumPages] = useState(0);
      const [scale, setScale] = useState(1.2);
      const [pdfDoc, setPdfDoc] = useState(null);
      const [epubRendition, setEpubRendition] = useState(null);
      const [fontSize, setFontSize] = useState(100); // percent
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [noteText, setNoteText] = useState('');
      const [showNotesDrawer, setShowNotesDrawer] = useState(false);
      const [showRtcDrawer, setShowRtcDrawer] = useState(false);
      const [chatInput, setChatInput] = useState('');

      const epubContainerRef = useRef(null);

      // Timer to track reading seconds
      useEffect(() => {
        const interval = setInterval(() => {
          setElapsedSeconds(prev => prev + 1);
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      // Load File
      useEffect(() => {
        if (!file) return;

        let blobUrl;

        if (fileType === 'pdf') {
          file.arrayBuffer().then(buffer => {
            const typedArray = new Uint8Array(buffer);
            const loadingTask = pdfjsLib.getDocument({ data: typedArray });
            loadingTask.promise.then(pdf => {
              setPdfDoc(pdf);
              setNumPages(pdf.numPages);
              const startPage = Math.min(Math.max(book.currentPage || 1, 1), pdf.numPages);
              setPageNum(startPage);
              renderPdfPage(pdf, startPage, scale);
            }).catch(err => {
              console.error("PDF loading error:", err);
              alert("PDF yüklenirken bir hata oluştu.");
            });
          }).catch(err => {
            console.error("PDF arrayBuffer error:", err);
            alert("PDF okunurken bir hata oluştu.");
          });
        } else if (fileType === 'epub') {
          try {
            blobUrl = URL.createObjectURL(file);
            const epubBook = ePub(blobUrl);
            epubBook.ready.then(() => {
              if (!epubContainerRef.current) return;
              const rendition = epubBook.renderTo(epubContainerRef.current, {
                width: "100%",
                height: "100%",
                flow: "paginated",
                stylesheet: isDark ? 'p { color: #E8D4BA !important; }' : 'p { color: #333333 !important; }'
              });
              setEpubRendition(rendition);
              rendition.display();

              // Sizing styling
              rendition.themes.fontSize(`${fontSize}%`);

              // Selection listener
              rendition.on("selected", (cfiRange, contents) => {
                const selectedText = rendition.getRange(cfiRange).toString();
                if (selectedText && selectedText.trim()) {
                  if (confirm(`Seçilen metni alıntı olarak eklemek ister misiniz?\n\n"${selectedText}"`)) {
                    onAddHighlight(selectedText);
                  }
                }
              });

              // Relocated page tracker
              rendition.on("relocated", (location) => {
                if (location.start) {
                  const percentage = location.start.percentage;
                  const estimatedPage = Math.round(percentage * (book.totalPages || 300)) || 1;
                  setPageNum(estimatedPage);
                  onUpdateProgress(estimatedPage, book.totalPages || 300);
                  if (rtcChannel && rtcStatus === 'connected') {
                    rtcChannel.send(JSON.stringify({ type: 'PAGE_CHANGE', page: estimatedPage }));
                  }
                }
              });
            }).catch(err => {
              console.error("EPUB ready parsing error:", err);
              alert("EPUB dosyası çözümlenemedi.");
            });
          } catch (err) {
            console.error("EPUB loading error:", err);
            alert("EPUB yüklenirken bir hata oluştu.");
          }
        }

        return () => {
          if (blobUrl) {
            URL.revokeObjectURL(blobUrl);
          }
        };
      }, [file, fileType]);

      // WebRTC Remote Page Synchronization Listener
      useEffect(() => {
        const handleRtcPage = (e) => {
          const targetPage = e.detail;
          if (fileType === 'pdf' && pdfDoc) {
            setPageNum(targetPage);
            renderPdfPage(pdfDoc, targetPage, scale);
          } else if (fileType === 'epub' && epubRendition) {
            const percentage = targetPage / (book.totalPages || 300);
            const cfi = epubRendition.book.locations.cfiFromPercentage(percentage);
            if (cfi) epubRendition.display(cfi);
          }
        };
        window.addEventListener('rtcPageChange', handleRtcPage);
        return () => window.removeEventListener('rtcPageChange', handleRtcPage);
      }, [fileType, pdfDoc, epubRendition, scale]);

      // Render PDF page on canvas
      const renderPdfPage = (pdf, pageNumber, currentScale) => {
        if (!pdf) return;
        pdf.getPage(pageNumber).then(page => {
          const canvas = document.getElementById('pdf-render-canvas');
          if (!canvas) return;
          const context = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: currentScale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          page.render(renderContext);

          // Update progress
          onUpdateProgress(pageNumber, pdf.numPages);
        });
      };

      // Zoom PDF
      const changeZoom = (delta) => {
        const newScale = Math.min(Math.max(scale + delta, 0.6), 2.5);
        setScale(newScale);
        if (pdfDoc) {
          renderPdfPage(pdfDoc, pageNum, newScale);
        }
      };

      // Navigate PDF Pages
      const handlePdfPageChange = (delta) => {
        if (!pdfDoc) return;
        const newPage = Math.min(Math.max(pageNum + delta, 1), numPages);
        setPageNum(newPage);
        renderPdfPage(pdfDoc, newPage, scale);
        if (rtcChannel && rtcStatus === 'connected') {
          rtcChannel.send(JSON.stringify({ type: 'PAGE_CHANGE', page: newPage }));
        }
      };

      // Navigate EPUB
      const handleEpubNav = (direction) => {
        if (!epubRendition) return;
        if (direction === 'next') {
          epubRendition.next();
        } else {
          epubRendition.prev();
        }
      };

      // EPUB Font sizing
      const changeFontSize = (delta) => {
        const newSize = Math.min(Math.max(fontSize + delta, 60), 200);
        setFontSize(newSize);
        if (epubRendition) {
          epubRendition.themes.fontSize(`${newSize}%`);
        }
      };

      const handleCloseReader = () => {
        const minutesRead = Math.max(1, Math.round(elapsedSeconds / 60));
        onClose(minutesRead, pageNum);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const addNoteHighlight = () => {
        if (noteText.trim()) {
          onAddHighlight(noteText.trim());
          setNoteText('');
          alert("Alıntı başarıyla eklendi!");
          setShowNotesDrawer(false);
        }
      };

      const paperSessions = (book.sessions || []).filter(s => s.type === 'paper');
      const minutesRead = elapsedSeconds / 60;
      const pagesRead = Math.max(0, pageNum - (book.currentPage || 1));
      const totalPagesLogged = paperSessions.reduce((sum, s) => sum + (s.pages || 0), 0) + pagesRead;
      const totalMinutesLogged = paperSessions.reduce((sum, s) => sum + (s.minutes || 0), 0) + minutesRead;
      const bookSpeed = totalMinutesLogged > 0 ? (totalPagesLogged / totalMinutesLogged) : 0.5;
      const remainingPages = Math.max(0, (book.totalPages || 300) - pageNum);
      const remainingMinutes = remainingPages > 0 ? (remainingPages / bookSpeed) : 0;

      const formatMinutesLeft = (mins) => {
        if (mins <= 0) return "Bitti";
        const h = Math.floor(mins / 60);
        const m = Math.round(mins % 60);
        return h > 0 ? `${h} sa ${m} dk` : `${m} dk`;
      };

      return (
        <div className="fixed inset-0 bg-black/90 flex flex-col z-50 animate-fade-in text-white font-sans">
          {/* Reader Header */}
          <div className="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-zinc-900/90 backdrop-blur-md">
            <div>
              <h2 className="font-bold text-sm truncate max-w-[200px] sm:max-w-md">{book.title}</h2>
              <p className="text-[10px] opacity-60 truncate">
                {book.author} • {fileType.toUpperCase()} • Kalan Süre: {formatMinutesLeft(remainingMinutes)} ({bookSpeed.toFixed(2)} sf/dk)
              </p>
            </div>
            <div className="flex items-center gap-4">

      const [rtcRole, setRtcRole] = useState(null); // 'host', 'guest'
      const [rtcOffer, setRtcOffer] = useState('');
      const [rtcAnswer, setRtcAnswer] = useState('');
      const [rtcName, setRtcName] = useState('');
      const [rtcChatHistory, setRtcChatHistory] = useState([]);

      const handleRtcMessage = (msg) => {
        if (msg.type === 'HANDSHAKE') {
          setRtcName(msg.name);
          alert(`Bağlantı Başarılı! ${msg.name} ile canlı okuma odası kuruldu.`);
        } else if (msg.type === 'CHAT') {
          setRtcChatHistory(prev => [...prev, {
            sender: msg.sender,
            text: msg.text,
            timestamp: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
          }]);
        } else if (msg.type === 'PAGE_CHANGE') {
          window.dispatchEvent(new CustomEvent('rtcPageChange', { detail: msg.page }));
        }
      };

      const setupDataChannel = (dc) => {
        dc.onopen = () => {
          setRtcStatus('connected');
          // Send handshake
          const storedProfile = localStorage.getItem('bookshelf_userProfile');
          const profileName = storedProfile ? JSON.parse(storedProfile).name : 'Bir Okur';
          dc.send(JSON.stringify({ type: 'HANDSHAKE', name: profileName }));
        };
        dc.onclose = () => {
          setRtcStatus('disconnected');
          setRtcChannel(null);
          setRtcPeer(null);
        };
        dc.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleRtcMessage(msg);
          } catch (e) {
            console.error("RTC Message Parsing Error:", e);
          }
        };
      };

      const setupPeerConnection = (role) => {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19002' }]
        });

        setRtcPeer(pc);
        setRtcStatus('connecting');
        setRtcRole(role);

        if (role === 'host') {
          const dc = pc.createDataChannel("chat");
          setupDataChannel(dc);
          setRtcChannel(dc);

          pc.createOffer().then(offer => pc.setLocalDescription(offer));

          pc.onicegatheringstatechange = () => {
            if (pc.iceGatheringState === 'complete') {
              setRtcOffer(btoa(JSON.stringify(pc.localDescription)));
            }
          };
        } else {
          pc.ondatachannel = (event) => {
            const dc = event.channel;
            setupDataChannel(dc);
            setRtcChannel(dc);
          };
        }
      };

      const connectAsHost = (answerBase64) => {
        if (!rtcPeer) return;
        try {
          const answer = JSON.parse(atob(answerBase64));
          rtcPeer.setRemoteDescription(new RTCSessionDescription(answer)).catch(err => {
            console.error("setRemoteDescription error:", err);
            alert("Bağlantı kodu eşleşmedi veya süresi doldu!");
          });
        } catch (err) {
          alert("Geçersiz bağlantı kodu formatı!");
        }
      };

      const connectAsGuest = (offerBase64) => {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19002' }]
        });
        setRtcPeer(pc);
        setRtcStatus('connecting');
        setRtcRole('guest');

        pc.ondatachannel = (event) => {
          const dc = event.channel;
          setupDataChannel(dc);
          setRtcChannel(dc);
        };

        try {
          const offer = JSON.parse(atob(offerBase64));
          pc.setRemoteDescription(new RTCSessionDescription(offer)).then(() => {
            return pc.createAnswer();
          }).then(answer => {
            return pc.setLocalDescription(answer);
          }).catch(err => {
            console.error("Guest WebRTC setup error:", err);
            alert("Odaya bağlanırken hata oluştu. Kodları kontrol edin.");

          pc.onicegatheringstatechange = () => {

              let newCurrentPage = book.currentPage || 0;
              let newStatus = book.status;

              if (logSession.type === 'paper') {
                newCurrentPage = Math.min(book.totalPages || newCurrentPage + pages, newCurrentPage + pages);
                if (book.totalPages && newCurrentPage >= book.totalPages) {
                  newStatus = 'read';
                }
              }

              const paperSessions = updatedSessions.filter(s => s.type === 'paper');
              const totalPagesLogged = paperSessions.reduce((sum, s) => sum + (s.pages || 0), 0);
              const totalMinutesLogged = paperSessions.reduce((sum, s) => sum + (s.minutes || 0), 0);
              const readingSpeed = totalMinutesLogged > 0 ? (totalPagesLogged / totalMinutesLogged) : 0;

              const updatedBook = {
                ...book,
                sessions: updatedSessions,
                currentPage: newCurrentPage,
                status: newStatus,
                readingSpeed: readingSpeed
              };

              if (selectedBook && selectedBook.id === bookId) {
                setSelectedBook(updatedBook);
              }

              return updatedBook;
            }
            return book;
          }));

          const newProgress = (streakData.dailyProgress?.minutes || 0) + minutes;
          let newStreak = streakData.streak;
          let newLastReadDate = streakData.lastReadDate;

          if (newProgress >= readingGoal && (streakData.dailyProgress?.minutes || 0) < readingGoal) {
            if (streakData.lastReadDate !== today) {
              newStreak += 1;
              newLastReadDate = today;

              if (newStreak > (streakData.longestStreak || 0)) {
                streakData.longestStreak = newStreak;
              }
            }
          }

          setStreakData({
            ...streakData,
            streak: newStreak,
            lastReadDate: newLastReadDate,
            dailyProgress: { date: today, minutes: newProgress }
          });

          setLogSession({
            bookId: '',
            type: 'paper',
            minutes: '',
            pages: '',
            mood: '😊',
            note: ''
          });
          setShowLogReading(false);
        }
      };

      const getGoalsProgress = () => {
        const today = new Date();
        const startOfWeek = new Date(today);
        const day = today.getDay();
        const diff = today.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        startOfWeek.setHours(0, 0, 0, 0);

        const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        startOfMonth.setHours(0, 0, 0, 0);

        let weeklyMinutes = 0;
        let monthlyMinutes = 0;

        books.forEach(b => {
          (b.sessions || []).forEach(s => {
            const sessDate = new Date(s.date);
            if (sessDate >= startOfWeek) {
              weeklyMinutes += s.minutes;
            }
            if (sessDate >= startOfMonth) {
              monthlyMinutes += s.minutes;
            }
          });
        });

        return { weeklyMinutes, monthlyMinutes };
      };

      const getXPInfo = () => {
        let totalPagesRead = books.reduce((sum, b) => {
          if (b.status === 'read') return sum + (b.totalPages || 0);
          return sum + (b.currentPage || 0);
        }, 0);

        let totalAudioMinutes = 0;
        let totalSessions = 0;
        books.forEach(b => {
          if (b.sessions) {
            totalSessions += b.sessions.length;
            b.sessions.forEach(s => {
              if (s.type === 'audio') totalAudioMinutes += s.minutes;
            });
          }
        });

        const xp = (totalPagesRead * 10) + (totalAudioMinutes * 2) + (totalSessions * 50);
        const level = Math.floor(Math.sqrt(xp / 100)) + 1;
        const currentLevelXP = Math.pow(level - 1, 2) * 100;
        const nextLevelXP = Math.pow(level, 2) * 100;
        const xpNeeded = nextLevelXP - currentLevelXP;
        const currentProgressXP = xp - currentLevelXP;
        const levelProgress = xpNeeded > 0 ? (currentProgressXP / xpNeeded) * 100 : 100;

        return { xp, level, currentProgressXP, xpNeeded, levelProgress };
      };

                            const today = new Date();
                            const datesArray = [];
                            for (let i = 364; i >= 0; i--) {
                              const d = new Date(today);
                              d.setDate(today.getDate() - i);
                              datesArray.push(d);
                            }

                            const columns = [];
                            let currentWeek = [];
                            const startDayOfWeek = datesArray[0].getDay();
                            for (let i = 0; i < startDayOfWeek; i++) {
                              currentWeek.push(null);
                            }

                            datesArray.forEach(date => {
                              currentWeek.push(date);
                              if (currentWeek.length === 7) {
                                columns.push(currentWeek);
                                currentWeek = [];
                              }
                            });
                            if (currentWeek.length > 0) {
                              while (currentWeek.length < 7) {
                                currentWeek.push(null);
                              }
                              columns.push(currentWeek);
                            }

                            const boxSize = 8;
                            const gap = 1.5;
                            const width = columns.length * (boxSize + gap);
                            const height = 7 * (boxSize + gap);

                                        const minutes = dailyReadingMap[dateStr] || 0;

                                        return (
                                          <rect
                                            key={rowIndex}
                                            y={rowIndex * (boxSize + gap)}
                                            width={boxSize}
                                            height={boxSize}
                                            rx={1}
                                            ry={1}
                                            fill={color}
                                            className="cursor-pointer"
                                          >
                                            <title>{`${formattedDate}: ${minutes} dakika okundu`}</title>
                                          </rect>
                                        );

                      placeholder="Seans ile ilgili aklında kalanlar..."
                      rows="2"
                      className={`w-full p-2.5 border-2 rounded-lg text-sm bg-transparent border-[#8D6E63]/30 focus:border-[#8D6E63] outline-none ${isDark ? 'bg-[#2D2620]' : 'bg-[#E8DCC8]'}`}
                    />
                  </div>

                  <button
                    onClick={logReadingTime}
                    disabled={!logSession.bookId || !logSession.minutes}
                    className="w-full py-3 bg-[#7B3F3F] text-white rounded-lg font-semibold hover:bg-[#5D3030] disabled:opacity-50 disabled:pointer-events-none transition-colors mt-2 shadow-lg"
                  >
                    Kaydet
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Yıllık Okuma Özeti Modalı */}
          {showYearlySummary && (() => {
            const userGenres = books.map(b => b.genre);
            const genreCounts = {};
            userGenres.forEach(g => { genreCounts[g] = (genreCounts[g] || 0) + 1; });
            const dominantGenre = Object.keys(genreCounts).sort((a, b) => genreCounts[b] - genreCounts[a])[0] || 'Bulunamadı';

            const allSessions = books.reduce((acc, b) => acc.concat(b.sessions || []), []);
            const audioSessions = allSessions.filter(s => s.type === 'audio');
            const paperSessions = allSessions.filter(s => s.type === 'paper');
            const totalPaperMinutes = paperSessions.reduce((sum, s) => sum + s.minutes, 0);
            const totalPagesRead = paperSessions.reduce((sum, s) => sum + s.pages, 0);
            const averageSpeed = totalPaperMinutes > 0 ? (totalPagesRead / totalPaperMinutes) : 0.5;

            return (
              <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4 overflow-y-auto">
                <div className="max-w-sm w-full relative">
                  <button
                    onClick={() => setShowYearlySummary(false)}
                    className="absolute -top-12 right-0 text-white hover:text-gray-300 transition-colors bg-black/40 p-2 rounded-full z-10"
                  >
                    <X size={24} />
                  </button>

                  <div
                    id="yearly-summary-card"
                    className="rounded-2xl overflow-hidden bg-gradient-to-br from-[#1E0B0B] via-[#2D1616] to-[#0D0404] text-white p-6 shadow-2xl relative border border-orange-500/20 aspect-[9/16] flex flex-col justify-between"
                    style={{ minHeight: '520px' }}
                  >
                    {/* Decorative Background Elements */}
                    <div className="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="absolute bottom-0 left-0 w-32 h-32 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] uppercase font-bold tracking-widest text-orange-400 bg-orange-500/10 px-2.5 py-1 rounded-full border border-orange-500/20">Okuma Kilometre Taşı</span>
                        <span className="text-xs opacity-60 font-semibold">{new Date().getFullYear()} Özeti</span>
                      </div>

                      <div className="pt-2">
                        <h2 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 via-red-400 to-purple-400 bg-clip-text text-transparent">OKUMA SERÜVENİM</h2>
                        <p className="text-xs opacity-80 mt-1 font-serif">Kelimelerin izinde bir yıl...</p>
                      </div>
                    </div>

                    <div className="space-y-4 my-auto">
                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-white/5 border border-white/10 rounded-xl p-3.5 flex flex-col justify-between">
                          <span className="text-[9px] uppercase font-bold opacity-60">Okunan Kitap</span>
                          <span className="text-2xl font-black text-orange-400 mt-1">{stats.read}</span>
                        </div>

                        <div className="bg-white/5 border border-white/10 rounded-xl p-3.5 flex flex-col justify-between">
                          <span className="text-[9px] uppercase font-bold opacity-60">Toplam Sayfa</span>
                          <span className="text-2xl font-black text-red-400 mt-1">{stats.totalPages}</span>
                        </div>
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-xl p-3.5 flex items-center justify-between">
                        <div>
                          <span className="text-[9px] uppercase font-bold opacity-60">Favori Türün</span>
                          <h4 className="font-extrabold text-lg mt-0.5 text-purple-400 truncate max-w-[150px]">{dominantGenre}</h4>
                        </div>
                        <Book size={24} className="text-purple-400 opacity-80" />
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-xl p-3.5 flex items-center justify-between">
                        <div>
                          <span className="text-[9px] uppercase font-bold opacity-60">Ortalama Hızın</span>
                          <h4 className="font-extrabold text-lg mt-0.5 text-emerald-400">{averageSpeed.toFixed(2)} sf/dk</h4>
                        </div>
                        <TrendingUp size={24} className="text-emerald-400 opacity-80" />
                      </div>

                      <div className="bg-white/5 border border-white/10 rounded-xl p-3.5 flex items-center justify-between">
                        <div>
                          <span className="text-[9px] uppercase font-bold opacity-60">En Uzun Seri</span>
                          <h4 className="font-extrabold text-lg mt-0.5 text-yellow-400">{(streakData.longestStreak || streakData.streak) || 0} Gün</h4>
                        </div>
                        <Fire size={24} className="text-yellow-500 fill-yellow-500/20 opacity-90" />
                      </div>
                    </div>

                    <div className="border-t border-white/10 pt-4 flex items-center justify-between">
                      <div className="flex items-center gap-1.5 text-xs opacity-75">
                        <BookOpen size={16} className="text-orange-400" />
                        <span className="font-bold">Kitaplık</span>
                      </div>
                      <button
                        onClick={() => {
                          const container = document.getElementById('yearly-summary-card');
                          if (container) {
                            html2canvas(container, {
                              backgroundColor: null,
                              useCORS: true,
                              scale: 2
                            }).then(canvas => {
                              const link = document.createElement('a');
                              link.download = 'okuma-yillik-ozet.png';
                              link.href = canvas.toDataURL('image/png');
                              link.click();
                            }).catch(err => {
                              console.error('Error generating image', err);
                            });
                          }
                        }}
                        className="px-3.5 py-1.5 bg-orange-500 hover:bg-orange-600 text-black font-extrabold rounded-lg text-[10px] uppercase tracking-wider transition-all flex items-center gap-1 shadow-lg shadow-orange-500/20 active:scale-95"
                      >
                        <span>Kayıt Et / Paylaş</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Share Library Modal */}
          {showShareLibrary && (() => {
            const bookTitles = books.slice(0, 5).map(b => b.title).join(', ');
            const shareText = `Kütüphanemi keşfet! (${books.length} kitap, ${stats.read} okunmuş). En son okuduklarım: ${bookTitles}...`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(shareText)}`;

            return (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div className={`rounded-xl max-w-sm w-full p-6 relative shadow-2xl ${isDark ? 'bg-[#382E26] text-[#E8D4BA]' : 'bg-[#D4B896] text-[#654321]'}`}>
                  <button
                    onClick={() => setShowShareLibrary(false)}
                    className="absolute top-4 right-4 opacity-70 hover:opacity-100 transition-opacity"
                  >
                    <X size={24} />
                  </button>

                  <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                    <Share2 size={24} className="text-[#8D6E63]" />
                    Kütüphanemi Paylaş
                  </h2>

                  <div className="space-y-4 text-center">
                    <p className="text-xs opacity-80">Arkadaşların kütüphaneni tarayarak okuduğun kitapları görebilir!</p>

                    <div className="bg-white p-3 rounded-lg inline-block shadow-inner mx-auto border border-gray-400/20">
                      <img
                        src={qrUrl}
                        alt="Library Share QR Code"
                        className="w-48 h-48 mx-auto"
                      />
                    </div>

                    <div className={`p-3 rounded-lg text-xs text-left italic border leading-relaxed bg-black/5 border-[#8D6E63]/25`}>
                      "{shareText}"
                    </div>

                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(shareText);
                        alert('Kütüphane bilgisi panoya kopyalandı!');
                      }}
                      className="w-full py-2.5 bg-[#7B3F3F] text-white rounded-lg font-semibold hover:bg-[#5D3030] transition-colors"
                    >
                      Metni Kopyala
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Book Detail Modal */}
          {selectedBook && (
            <BookDetail
              book={selectedBook}
              onClose={() => setSelectedBook(null)}
              onUpdate={updateBook}
              onDelete={deleteBook}
              isDark={isDark}
              themeColors={themeColors}
              collections={collections}
              onUpdateCollection={toggleBookInCollection}
              onShareQuote={openQuoteCreator}
              onOpenReader={openReader}
            />
          )}

          {/* E-Kitap Okuyucu Modalı */}
          {readerModalOpen && activeReaderBook && readerFileContent && (
            <EBookReader
              book={activeReaderBook}
              file={readerFileContent}
              fileType={readerFileType}
              isDark={isDark}
              themeColors={themeColors}
              rtcStatus={rtcStatus}
              rtcChannel={rtcChannel}
              rtcChatHistory={rtcChatHistory}
              rtcName={rtcName}
              onSendRtcMessage={onSendRtcMessage}
              onClose={(minutesRead, finalPage) => {
                if (minutesRead > 0) {
                  const today = new Date().toLocaleDateString('tr-TR');
                  const newSession = {
                    id: Date.now(),
                    date: today,
                    minutes: minutesRead,
                    pages: Math.max(0, finalPage - (activeReaderBook.currentPage || 0)),
                    type: 'paper',
                    mood: '😊'
                  };
                  
                  const isFinished = finalPage >= activeReaderBook.totalPages;
                  
                  const updatedSessions = [...(activeReaderBook.sessions || []), newSession];
                  updateBook(activeReaderBook.id, {
                    currentPage: finalPage,
                    sessions: updatedSessions,
                    status: isFinished ? 'read' : 'reading'
                  });

                  if (isFinished && navigator.vibrate) {
                    navigator.vibrate([200, 100, 200]);
                  }

                  setCircleFeed([{
                    id: Date.now(),
                    username: userProfile.username,
                    name: userProfile.name,
                    avatar: '📖',
                    type: isFinished ? 'finish' : 'thought',
                    text: isFinished 
                      ? `${activeReaderBook.title} kitabını bitirdi! 🥳`
                      : `${activeReaderBook.title} kitabından ${newSession.pages} sayfa okudu!`,
                    timestamp: 'Şimdi',
                    likes: 0,
                    liked: false,
                    comments: [],
                    bookTitle: activeReaderBook.title,
                    bookAuthor: activeReaderBook.author
                  }, ...circleFeed]);

                  if (isKidsMode) {
                    const earnedXp = newSession.pages * 2 + minutesRead * 5;
                    setKidsXp(prev => prev + earnedXp);
                    if (navigator.vibrate) {
                      navigator.vibrate([100, 50, 100]);
                    }
                    alert(`Okuman tamamlandı! 🎉\n${newSession.pages} sayfa ve ${minutesRead} dakika için ${earnedXp} XP kazandın!`);
                  }
                }
                
                setReaderModalOpen(false);
                setActiveReaderBook(null);
                setReaderFileContent(null);
              }}
              onUpdateProgress={(pageNum, totalPages) => {
                updateBook(activeReaderBook.id, {
                  currentPage: pageNum,
                  totalPages: totalPages
                });
              }}
              onAddHighlight={(text) => {
                addHighlight(activeReaderBook.id, text);
              }}
            />
          )}



        </div>
      );
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered successfully!', reg.scope))
          .catch(err => console.error('Service Worker registration failed!', err));
      });
    }

    ReactDOM.render(<BookshelfApp />, document.getElementById('root'));
  </script>
</body>

</html>
